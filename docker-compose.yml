version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: argus_postgis
    environment:
      - POSTGRES_USER=argus
      - POSTGRES_PASSWORD=argus_secure_password
      - POSTGRES_DB=argus_db
    ports:
      - "5433:5432"
    volumes:
      - argus_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: argus_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argus_api
    environment:
      - DATABASE_URL=postgresql+psycopg://argus:argus_secure_password@db:5432/argus_db
      - REDIS_URL=redis://redis:6379
      - AI_DEVICE=cpu
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/ai_service/weights:/app/backend/ai_service/weights
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  argus_db_data:
